<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>천치원 시즌2</title>
<link rel="icon" href="logo.png" />
<link rel="stylesheet" href="css/style.css?v=91750c2" />
<link rel="stylesheet" href="css/formation.css?v=91750c2" />
</head>
<body>

<div class="bg-glow"></div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <img src="logo.png" alt="천치원 로고" class="brand-logo" />
      <div class="brand-text">
        <span class="brand-name club-name-slot">천치원 시즌2</span>
        <span class="brand-sub">FOOTBALL SCHOOL</span>
      </div>
    </div>
    <nav class="nav-tabs">
      <button class="nav-tab active" data-tab="tab-instructors">강사진</button>
      <button class="nav-tab" data-tab="tab-applicants">지원자</button>
      <button class="nav-tab" data-tab="tab-control">지통실</button>
      <button class="nav-tab" data-tab="tab-schedule">일정</button>
      <button class="nav-tab" data-tab="tab-board">전술보드</button>
    </nav>
  </div>
</header>

<main>

  <!-- ================= 강사진 ================= -->
  <section id="tab-instructors" class="tab-panel active">
    <div class="section-head">
      <h2 class="section-title">강사진</h2>
      <span class="section-sub club-name-slot">천치원 시즌2</span>
    </div>
    <div id="instructor-grid" class="instructor-grid"></div>
  </section>

  <!-- ================= 지원자 (지원글 모아보기) ================= -->
  <section id="tab-applicants" class="tab-panel">
    <div class="section-head">
      <h2 class="section-title">지원자</h2>
      <span class="section-sub" id="post-feed-count">0명 지원</span>
    </div>
    <div class="post-feed-toolbar">
      <input id="post-feed-search" class="post-feed-search" type="text" placeholder="닉네임 검색..." autocomplete="off" />
      <div class="post-feed-sort-toolbar">
        <button id="post-feed-position-filter-btn" class="sort-btn" type="button">포지션별 보기</button>
        <button class="sort-btn" data-sort="likes">UP순</button>
      </div>
    </div>
    <div id="post-feed" class="post-feed"></div>
  </section>

  <!-- 포지션별 보기 필터 팝업 (지원자 탭) -->
  <div id="position-filter-modal" class="modal-overlay" hidden>
    <div class="modal-panel position-filter-panel" role="dialog" aria-modal="true" aria-labelledby="position-filter-title">
      <div class="modal-head">
        <h3 id="position-filter-title">포지션</h3>
        <button id="position-filter-close" class="modal-close-btn" type="button" aria-label="닫기">×</button>
      </div>
      <div class="position-filter-rows">
        <div class="position-filter-row">
          <label class="position-filter-chip position-filter-chip--all"><input type="checkbox" data-group="fw" data-role="group-all" />FW 전체</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="ST" data-group="fw" />ST</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="CF" data-group="fw" />CF</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="LW" data-group="fw" />LW</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="RW" data-group="fw" />RW</label>
        </div>
        <div class="position-filter-row">
          <label class="position-filter-chip position-filter-chip--all"><input type="checkbox" data-group="mf" data-role="group-all" />MF 전체</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="CM" data-group="mf" />CM</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="CAM" data-group="mf" />CAM</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="CDM" data-group="mf" />CDM</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="LM" data-group="mf" />LM</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="RM" data-group="mf" />RM</label>
        </div>
        <div class="position-filter-row">
          <label class="position-filter-chip position-filter-chip--all"><input type="checkbox" data-group="df" data-role="group-all" />DF 전체</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="CB" data-group="df" />CB</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="RB" data-group="df" />RB</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="LB" data-group="df" />LB</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="RWB" data-group="df" />RWB</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="LWB" data-group="df" />LWB</label>
        </div>
        <div class="position-filter-row">
          <label class="position-filter-chip position-filter-chip--all"><input type="checkbox" data-group="gk" data-role="group-all" />GK 전체</label>
        </div>
      </div>
      <div class="modal-actions">
        <button id="position-filter-reset" class="sort-btn" type="button">초기화</button>
      </div>
    </div>
  </div>

  <!-- 포지션별 보기 필터 팝업 (지통실 탭) -->
  <div id="control-position-filter-modal" class="modal-overlay" hidden>
    <div class="modal-panel position-filter-panel" role="dialog" aria-modal="true" aria-labelledby="control-position-filter-title">
      <div class="modal-head">
        <h3 id="control-position-filter-title">포지션</h3>
        <button id="control-position-filter-close" class="modal-close-btn" type="button" aria-label="닫기">×</button>
      </div>
      <div class="position-filter-rows">
        <div class="position-filter-row">
          <label class="position-filter-chip position-filter-chip--all"><input type="checkbox" data-group="fw" data-role="group-all" />FW 전체</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="ST" data-group="fw" />ST</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="CF" data-group="fw" />CF</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="LW" data-group="fw" />LW</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="RW" data-group="fw" />RW</label>
        </div>
        <div class="position-filter-row">
          <label class="position-filter-chip position-filter-chip--all"><input type="checkbox" data-group="mf" data-role="group-all" />MF 전체</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="CM" data-group="mf" />CM</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="CAM" data-group="mf" />CAM</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="CDM" data-group="mf" />CDM</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="LM" data-group="mf" />LM</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="RM" data-group="mf" />RM</label>
        </div>
        <div class="position-filter-row">
          <label class="position-filter-chip position-filter-chip--all"><input type="checkbox" data-group="df" data-role="group-all" />DF 전체</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="CB" data-group="df" />CB</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="RB" data-group="df" />RB</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="LB" data-group="df" />LB</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="RWB" data-group="df" />RWB</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="LWB" data-group="df" />LWB</label>
        </div>
        <div class="position-filter-row">
          <label class="position-filter-chip position-filter-chip--all"><input type="checkbox" data-group="gk" data-role="group-all" />GK 전체</label>
        </div>
      </div>
      <div class="modal-actions">
        <button id="control-position-filter-reset" class="sort-btn" type="button">초기화</button>
      </div>
    </div>
  </div>

  <!-- 포지션별 보기 필터 팝업 (전술보드 탭) -->
  <div id="roster-position-filter-modal" class="modal-overlay" hidden>
    <div class="modal-panel position-filter-panel" role="dialog" aria-modal="true" aria-labelledby="roster-position-filter-title">
      <div class="modal-head">
        <h3 id="roster-position-filter-title">포지션</h3>
        <button id="roster-position-filter-close" class="modal-close-btn" type="button" aria-label="닫기">×</button>
      </div>
      <div class="position-filter-rows">
        <div class="position-filter-row">
          <label class="position-filter-chip position-filter-chip--all"><input type="checkbox" data-group="fw" data-role="group-all" />FW 전체</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="ST" data-group="fw" />ST</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="CF" data-group="fw" />CF</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="LW" data-group="fw" />LW</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="RW" data-group="fw" />RW</label>
        </div>
        <div class="position-filter-row">
          <label class="position-filter-chip position-filter-chip--all"><input type="checkbox" data-group="mf" data-role="group-all" />MF 전체</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="CM" data-group="mf" />CM</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="CAM" data-group="mf" />CAM</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="CDM" data-group="mf" />CDM</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="LM" data-group="mf" />LM</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="RM" data-group="mf" />RM</label>
        </div>
        <div class="position-filter-row">
          <label class="position-filter-chip position-filter-chip--all"><input type="checkbox" data-group="df" data-role="group-all" />DF 전체</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="CB" data-group="df" />CB</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="RB" data-group="df" />RB</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="LB" data-group="df" />LB</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="RWB" data-group="df" />RWB</label>
          <label class="position-filter-chip"><input type="checkbox" data-token="LWB" data-group="df" />LWB</label>
        </div>
        <div class="position-filter-row">
          <label class="position-filter-chip position-filter-chip--all"><input type="checkbox" data-group="gk" data-role="group-all" />GK 전체</label>
        </div>
      </div>
      <div class="modal-actions">
        <button id="roster-position-filter-reset" class="sort-btn" type="button">초기화</button>
      </div>
    </div>
  </div>

  <!-- ================= 지통실 (방송 현황판) ================= -->
  <section id="tab-control" class="tab-panel">
    <div class="section-head">
      <h2 class="section-title">지통실</h2>
      <span class="section-sub" id="control-count">0명 지원</span>
    </div>
    <div class="control-toolbar">
      <button id="control-position-filter-btn" class="sort-btn" type="button">포지션별 보기</button>
      <button id="control-only-fc26" class="sort-btn active" type="button" title="방송 태그가 EA Sports FC 26인 방송만 보여줘요">잔디만 보기</button>
      <button id="control-refresh-btn" class="sort-btn control-refresh-btn" type="button">방송 새로고침</button>
    </div>
    <div id="control-grid" class="applicant-grid"></div>
  </section>

  <!-- ================= 일정 ================= -->
  <section id="tab-schedule" class="tab-panel">
    <div class="section-head">
      <h2 class="section-title">일정</h2>
      <span class="section-sub club-name-slot">천치원 시즌2</span>
    </div>

    <div class="calendar-toolbar">
      <button id="calendar-prev" class="calendar-nav-btn" aria-label="이전 달">‹</button>
      <span id="calendar-month-label" class="calendar-month-label">2026년 8월</span>
      <button id="calendar-next" class="calendar-nav-btn" aria-label="다음 달">›</button>
    </div>

    <div class="calendar-weekdays">
      <span class="calendar-weekday calendar-weekday--sun">일</span>
      <span class="calendar-weekday">월</span>
      <span class="calendar-weekday">화</span>
      <span class="calendar-weekday">수</span>
      <span class="calendar-weekday">목</span>
      <span class="calendar-weekday">금</span>
      <span class="calendar-weekday calendar-weekday--sat">토</span>
    </div>
    <div id="calendar-grid" class="calendar-grid"></div>
  </section>

  <!-- ================= 전술보드 ================= -->
  <section id="tab-board" class="tab-panel">
    <div class="section-head">
      <div class="board-title-row">
        <h2 class="section-title">전술보드</h2>
        <div class="orientation-toggle">
          <button id="orientation-landscape" class="sort-btn orientation-btn active" data-orientation="landscape" type="button">↔ 가로</button>
          <button id="orientation-portrait" class="sort-btn orientation-btn" data-orientation="portrait" type="button">↕ 세로</button>
        </div>
      </div>
    </div>

    <div class="board-stage">
      <div class="pitch-wrap">
        <div id="pitch" class="pitch">
          <svg viewBox="-2 -9 109 86" preserveAspectRatio="xMidYMid meet">
            <defs>
              <clipPath id="grassClip">
                <rect x="-2" y="-9" width="109" height="86" />
              </clipPath>
            </defs>

            <!-- 잔디: 그라운드뿐 아니라 위아래 사이드라인 밖 벤치 공간까지 같은 색으로 연장 -->
            <g clip-path="url(#grassClip)">
              <rect x="-2" y="-9" width="109" height="86" fill="#0d3d20" />
              <g fill="#0f4526">
                <rect x="-2"   y="-9" width="10.7" height="86" />
                <rect x="18.8" y="-9" width="10.7" height="86" />
                <rect x="39.9" y="-9" width="10.7" height="86" />
                <rect x="61"   y="-9" width="10.7" height="86" />
                <rect x="82.1" y="-9" width="10.7" height="86" />
                <rect x="103.2" y="-9" width="10.7" height="86" />
              </g>
            </g>

            <!-- 위아래 사이드라인 밖 벤치 공간 표시 -->
            <g fill="#e9fff2" fill-opacity="0.18" font-size="3.6" font-weight="700" letter-spacing="1.3" text-anchor="middle">
              <text x="52.5" y="-3">BENCH</text>
              <text x="52.5" y="73">BENCH</text>
            </g>
            <g fill="none" stroke="#e9fff2" stroke-width="0.35" stroke-opacity="0.85">
              <rect x="0" y="0" width="105" height="68" />
              <line x1="52.5" y1="0" x2="52.5" y2="68" />
              <circle cx="52.5" cy="34" r="9.15" />
              <rect x="0" y="13.84" width="16.5" height="40.32" />
              <rect x="0" y="24.84" width="5.5" height="18.32" />
              <path d="M 16.5 26.69 A 9.15 9.15 0 0 1 16.5 41.31" />
              <rect x="88.5" y="13.84" width="16.5" height="40.32" />
              <rect x="99.5" y="24.84" width="5.5" height="18.32" />
              <path d="M 88.5 26.69 A 9.15 9.15 0 0 0 88.5 41.31" />
              <path d="M -1.5 30.34 L 0 30.34" />
              <path d="M -1.5 37.66 L 0 37.66" />
              <path d="M 105 30.34 L 106.5 30.34" />
              <path d="M 105 37.66 L 106.5 37.66" />
              <path d="M 1 0 A 1 1 0 0 1 0 1" />
              <path d="M 0 67 A 1 1 0 0 1 1 68" />
              <path d="M 104 68 A 1 1 0 0 1 105 67" />
              <path d="M 105 1 A 1 1 0 0 1 104 0" />
            </g>
            <g fill="#e9fff2" fill-opacity="0.85">
              <circle cx="52.5" cy="34" r="0.35" />
              <circle cx="11" cy="34" r="0.35" />
              <circle cx="94" cy="34" r="0.35" />
            </g>
          </svg>
          <div id="pitch-tokens" class="pitch-tokens"></div>
        </div>
        <p id="pitch-hint" class="pitch-hint">그라운드 안은 선발, 위아래 사이드라인 밖 어두운 공간은 벤치예요. 다시 드래그해서 옮길 수 있고, ×를 누르거나 명단 쪽으로 끌면 제거돼요.</p>
      </div>

      <!-- 좌측 플로팅: 지원자 명단 -->
      <aside id="roster-panel" class="roster-floating">
        <div class="floating-panel-head">
          <h2 class="panel-title">👥 지원자 명단</h2>
          <button id="roster-toggle" class="floating-toggle-btn" aria-label="명단 접기/펼치기" title="명단 접기/펼치기">‹</button>
        </div>
        <div class="floating-panel-body">
          <div class="roster-add-form">
            <input id="roster-add-input" class="roster-add-input" type="text" placeholder="이름 직접 입력..." autocomplete="off" maxlength="20" />
            <button id="roster-add-btn" class="roster-add-btn" type="button" title="명단에 추가">＋ 직접추가</button>
          </div>
          <input id="roster-search" class="roster-search" type="text" placeholder="닉네임 검색..." autocomplete="off" />
          <div class="roster-sort-toolbar">
            <button id="roster-position-filter-btn" class="sort-btn roster-sort-btn" type="button">포지션별 보기</button>
          </div>
          <div id="roster-list" class="roster-list"></div>
        </div>
      </aside>

      <!-- 우측 플로팅: 그리기 · 보드 도구 -->
      <aside id="tools-panel" class="tools-floating">
        <div class="floating-panel-head">
          <h2 class="panel-title">🎨 도구</h2>
          <button id="tools-toggle" class="floating-toggle-btn" aria-label="도구 접기/펼치기" title="도구 접기/펼치기">›</button>
        </div>
        <div class="floating-panel-body">
          <div class="drawing-toolbar-v">
            <button id="btn-add-dummy" class="draw-btn draw-btn--dummy">🟢 더미선수 추가</button>
            <button id="draw-red" class="draw-btn draw-btn--red" data-color="red">🔴 빨간펜</button>
            <button id="draw-blue" class="draw-btn draw-btn--blue" data-color="blue">🔵 파란펜</button>
            <button id="draw-undo" class="draw-btn">↩ 되돌리기</button>
            <button id="draw-clear" class="draw-btn">🗑 그림 지우기</button>
            <span class="drawing-hint">ESC로 펜 끄기 · Ctrl+Z로 되돌리기</span>
          </div>
          <div class="board-toolbar-v">
            <button id="btn-screenshot" class="quick-link-btn">📸 그라운드 스크린샷</button>
            <button id="btn-clear" class="quick-link-btn">🗑 배치 초기화</button>
            <span id="placed-count" class="section-sub">그라운드 0 · 벤치 0 / 전체 0</span>
          </div>
        </div>
      </aside>
    </div>
  </section>

</main>

<button id="scroll-top-btn" class="scroll-top-btn" aria-label="맨 위로 이동" title="맨 위로">⬆</button>

<script src="js/data.js?v=91750c2"></script>
<script src="js/main.js?v=91750c2"></script>
</body>
</html>
